<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZiiDi Trader · Copy Trading</title>
<style>
:root{--bg:#111;--card:#1e1e1e;--card2:#272727;--line:#333;--txt:#fff;--mut:#9b9b9b;--g:#2da44a;--gt:#3fdc6b;--r:#ff4560;--blue:#0a64ff;--gold:#e8b931}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 35%,#2f7a47 0%,#1b4a2c 38%,#0c2415 75%,#07150d 100%) fixed;color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px}
.notes{position:fixed;left:24px;bottom:24px;width:170px;font-size:13px;line-height:1.5;color:#bbb}
.notes h2{margin:0 0 6px;font-size:18px;color:#fff}
.notes ol{padding-left:18px;margin:12px 0}
.notes li{margin-bottom:8px}
.notes b{color:#fff}
.notes .nbtn{display:block;width:100%;padding:10px;border-radius:10px;background:#0c2415cc;border:1px solid #3fdc6b88;color:#e6ffee;font-size:13px}
.notes .nbtn:hover{border-color:var(--g)}
.phone{position:relative;width:393px;height:820px;max-height:calc(100vh - 40px);background:var(--bg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 7px #2b2b2b,0 0 0 9px #4a4a4a,0 0 90px 10px #3fdc6b44,0 30px 70px #000a}
@media(max-width:760px){.notes{display:none}.stage{padding:0}.phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;flex:none}
header h1{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 .bk{font-size:26px;line-height:1;padding:0 6px 3px 0;color:var(--gt)}
.capsule{display:flex;align-items:center;border:1.5px solid #444;border-radius:20px;padding:5px 12px;gap:10px;color:#ddd;font-size:15px}
.capsule i{width:1px;height:16px;background:#555}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{flex:none;display:flex;background:#1b1b1b;border-top:1px solid #262626;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#ddd}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;padding:5px 14px;box-sizing:content-box;border-radius:14px}
nav button.on{color:var(--gt);font-weight:600}
nav button.on svg{background:#1d3a26}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.h2{font-size:17px;font-weight:600;margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font-size:13px;color:var(--mut);font-weight:400}
.mut{color:var(--mut)}.up{color:var(--gt)}.dn{color:var(--r)}
.btn{display:block;width:100%;padding:15px;border-radius:30px;background:var(--g);color:#fff;font-size:16px;font-weight:600;text-align:center}
.btn.sm{display:inline-block;width:auto;padding:9px 18px;font-size:14px}
.btn.ghost{background:transparent;border:1.5px solid var(--g);color:var(--gt)}
.btn.red{background:#3a1a1f;color:var(--r)}
.btn[disabled]{opacity:.4}
.seg{display:flex;background:var(--card);border:1px solid #2b2b2b;border-radius:14px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;padding:12px 4px;border-radius:10px;font-weight:600;color:#666;font-size:15px}
.seg button.on{background:var(--g);color:#0b1b10}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.pills button{flex:none;padding:11px 18px;border-radius:12px;background:var(--card2);color:var(--mut);font-size:14px}
.pills button.on{background:var(--g);color:#0b1b10;font-weight:600}
.search{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:15px;color:var(--mut);margin-bottom:14px}
.banner{display:flex;gap:10px;align-items:center;background:#2a161a;color:var(--r);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ticker{display:flex;gap:26px;overflow:hidden;background:#1a1a1a;margin:0 -16px 12px;padding:12px 16px;white-space:nowrap;font-size:15px}

.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px;margin-bottom:8px;cursor:pointer}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px}
.row .sub{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk{width:20px;text-align:center;font-weight:700;color:var(--mut);font-size:15px}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.chip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;background:#333;margin-left:6px;font-weight:600;vertical-align:1px}
.flag{font-size:11.5px;color:var(--gold);margin-top:4px}
.rowR{text-align:right}
.rowR b{font-size:16px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:4px;background:#3a3a3a;border-radius:1px}
.scroller{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.scroller>*{scroll-snap-align:start}
.tcard{flex:none;width:200px;background:var(--card);border:1px solid #1f4d2c;border-radius:16px;padding:14px;cursor:pointer}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat3>div{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.stat3 b{display:block;font-size:18px;margin-bottom:2px}
.stat3 small{font-size:11px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>div{background:var(--card2);border-radius:12px;padding:12px}
.grid2 small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:3px}
.grid2 b{font-size:15px}
.acc{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:17px 16px;color:var(--gt);font-size:16px;font-weight:600;text-align:left}
.acc>div{display:none;padding:0 16px 16px;font-size:14px}
.acc.open>div{display:block}
.acc.open>button .chev{transform:rotate(180deg)}
.chev{transition:.2s}
.meter{height:8px;background:#333;border-radius:4px;overflow:hidden;margin:5px 0 12px}
.meter i{display:block;height:100%;background:var(--g);border-radius:4px}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.sheetbg{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#1c1c1c;border-radius:24px 24px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;transform:translateY(105%);transition:.28s;z-index:21}
.sheet.on{transform:none}
.grip{width:40px;height:4px;background:#444;border-radius:2px;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chips button{padding:10px 14px;border-radius:12px;background:var(--card2);font-size:14px}
.chips button.on{background:#1d3a26;color:var(--gt);outline:1.5px solid var(--g)}
input[type=number]{width:100%;padding:14px;border-radius:14px;border:1.5px solid #333;background:#111;color:#fff;font-size:22px;font-weight:700;letter-spacing:.02em}
label.ck{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.45;margin:12px 0;color:#ddd}
label.ck input{width:20px;height:20px;accent-color:var(--g);flex:none;margin-top:1px}
.pt{display:flex;gap:12px;margin:12px 0;font-size:14px;line-height:1.45}
.pt .n{flex:none;width:24px;height:24px;border-radius:50%;background:#1d3a26;color:var(--gt);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:36px 12px}
.empty .ic{font-size:44px;margin-bottom:8px}
.legal p{font-size:13.5px;line-height:1.55;color:#ccc;margin:0 0 14px}
.legal h4{margin:16px 0 4px;font-size:14.5px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0}
.split i{display:block}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #2a2a2a;gap:14px;font-size:14.5px}
.toggle small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw{flex:none;width:46px;height:27px;border-radius:14px;background:#444;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{left:22px}
.cta{position:sticky;bottom:-24px;margin:16px -16px -24px;padding:12px 16px 16px;background:linear-gradient(#1100,#111 30%)}
.menu{display:flex;gap:14px;align-items:center;padding:18px 4px;cursor:pointer}
.menu b{display:block;font-weight:500;font-size:16px}.menu small{color:var(--mut);font-size:13px}
.menu .ic{font-size:22px;width:28px;text-align:center}
.menu .go{margin-left:auto;color:#ccc;font-size:20px}
.pop{display:inline-block;font-size:10px;font-weight:800;color:#111;background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px;letter-spacing:.05em}
.isnew{position:relative}
body.hl .isnew{outline:2px dashed var(--gold);outline-offset:2px}
body:not(.hl) .pop{display:none}
.toast{position:absolute;left:16px;right:16px;top:70px;background:#1d3a26;color:var(--gt);padding:12px 16px;border-radius:12px;font-size:14px;z-index:30;transition:.3s;opacity:0;pointer-events:none}
.toast.on{opacity:1}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.pinpad button{padding:15px;border-radius:14px;background:var(--card2);font-size:22px;font-weight:600}
.dots{display:flex;gap:14px;justify-content:center;margin:14px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #666}.dots i.f{background:var(--gt);border-color:var(--gt)}
.mpesa{display:inline-block;background:#43b02a;color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:2px 8px;letter-spacing:.05em}
.ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2a2a2a;font-size:14px}.ln:last-child{border-bottom:0}
.ln small{display:block;color:var(--mut);font-size:11.5px}
.pinbadge{display:inline-block;background:#3a1a1f;color:var(--r);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:6px}
.alertc{background:#2a161a;border:1px solid #5a2a32;border-radius:14px;padding:13px;margin-bottom:8px;font-size:13.5px}
.updc{background:#1d3a26;border:1px solid #2b6a3c;border-radius:14px;padding:13px;margin-bottom:8px;font-size:13.5px}
body.bare{background:#111!important}body.bare .stage{padding:0;display:block;min-height:0}body.bare .notes{display:none}
body.bare *{transition:none!important}
body.bare .phone{box-shadow:none;border-radius:0;max-height:none;height:820px!important;width:393px!important;position:absolute;left:50%;margin-left:-196.5px;top:0}
</style>
</head>
<body>
<div class="stage">
  <aside class="notes">
    <button class="nbtn" onclick="resetAll()">↺ Reset demo</button>
  </aside>

  <div class="phone" id="phone">
    <header id="hdr"></header>
    <main id="view"></main>
    <nav id="nav"></nav>
    <div class="sheetbg" id="bg" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const K0=n=>'KSh '+Math.round(n).toLocaleString('en-KE');
const K2=n=>'KSh '+n.toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);
const pct=(n,d=1)=>(n>=0?'+':'')+n.toFixed(d)+'%';
const cl=x=>Math.max(0,Math.min(1,x));
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}

/* ---------- data (simulated) ---------- */
const SECTOR={SCOM:'Telecom',EQTY:'Banking',KCB:'Banking',COOP:'Banking',ABSA:'Banking',NCBA:'Banking',EABL:'Manufacturing',BAT:'Manufacturing',BAMB:'Manufacturing',KEGN:'Energy',KPLC:'Energy',JUB:'Insurance',CTUM:'Investment',Cash:'Cash'};
const SCOL={Telecom:'#3fdc6b',Banking:'#4aa3ff',Manufacturing:'#e8b931',Energy:'#ff8a4a',Insurance:'#b583ff',Investment:'#ff6fa8',Cash:'#666'};
// name, style, ret12, ret3, maxDD, win, sortino, risk(1-5), copiers, aum, days, trades, concentration(top trade % of profit), positive months, hold(d), holdings
const RAW=[
['Wanjiru K.','Dividend compounder',24.8,6.1,-6.2,68,2.1,2,1840,48.2e6,412,186,14,11,96,[['SCOM',28],['EQTY',22],['KCB',15],['EABL',12],['Cash',23]]],
['Brian O.','Momentum swing',41.5,9.8,-18.4,57,1.3,4,1320,36.5e6,301,240,22,9,12,[['KEGN',30],['EQTY',26],['SCOM',20],['KPLC',14],['Cash',10]]],
['Aisha H.','Blue-chip steady',19.2,4.4,-4.1,71,2.4,1,2210,61.0e6,530,98,11,11,140,[['SCOM',35],['EABL',22],['COOP',18],['BAT',10],['Cash',15]]],
['David N.','Concentrated bets',63.0,21.0,-27.5,52,0.7,5,960,12.4e6,118,21,61,3,5,[['KPLC',55],['KEGN',30],['Cash',15]]],
['Faith M.','Value hunter',22.3,5.2,-8.9,64,1.8,2,640,14.8e6,260,74,18,8,120,[['BAMB',24],['JUB',22],['NCBA',20],['CTUM',12],['Cash',22]]],
['Kevin A.','Banking specialist',27.9,7.0,-12.0,60,1.6,3,790,19.3e6,340,132,27,10,45,[['EQTY',34],['KCB',28],['COOP',18],['ABSA',12],['Cash',8]]],
['Amina S.','Dividend income',16.4,3.8,-3.5,73,2.2,1,1480,29.7e6,610,64,9,12,180,[['SCOM',30],['BAT',24],['EABL',20],['COOP',14],['Cash',12]]],
['Otieno W.','Day trader',33.0,2.0,-22.0,51,0.9,5,410,5.1e6,205,612,15,7,2,[['SCOM',40],['EQTY',30],['KCB',20],['Cash',10]]],
['Grace N.','Growth & rotation',30.6,8.1,-11.2,62,1.7,3,1105,24.0e6,388,158,20,10,30,[['EQTY',28],['SCOM',24],['KEGN',18],['NCBA',14],['Cash',16]]],
['Samuel D.','Rising star',14.8,5.9,-5.0,66,1.9,2,85,1.6e6,96,37,16,3,40,[['SCOM',32],['COOP',24],['EABL',18],['Cash',26]]]
];
const COLS=['#2da44a','#4aa3ff','#b583ff','#ff6b6b','#e8b931','#2bb3a3','#ff8a4a','#6c7ae0','#d0589a','#5aa86a'];
const RISKL=['','Cautious','Steady','Balanced','Aggressive','Speculative'];
function skill(t){ // Arena Score, 0-1000: the six weighted dimensions of the original Arena ranking engine
  const m=Math.max(1,Math.min(12,Math.round(t.days/30))),cash=(t.h.find(x=>x[0]==='Cash')||[0,0])[1],inv=(100-cash)/100,hp=t.h.filter(x=>x[0]!=='Cash'),maxPos=Math.max(...hp.map(x=>x[1]));
  const sec={};hp.forEach(([k,v])=>{sec[SECTOR[k]]=(sec[SECTOR[k]]||0)+v/(100-cash)});const hhi=Object.values(sec).reduce((a,x)=>a+x*x,0);
  const parts={risk:cl(t.sortino/2.5),cons:.5*cl(t.pos/m)+.5*cl(1-t.conc/60),cap:cl((t.ret12/inv)/40),dec:(cl((t.win-45)/30)+cl(1-(maxPos-25)/40)+cl(1+t.dd/30))/3,track:cl(t.days/365),div:cl((1-hhi)/.75)};
  return{score:Math.round(1000*(.30*parts.risk+.25*parts.cons+.15*parts.cap+.15*parts.dec+.10*parts.track+.05*parts.div)),parts,months:m};}
const TR=RAW.map((r,i)=>{const t={id:i,name:r[0],style:r[1],ret12:r[2],ret3:r[3],dd:r[4],win:r[5],sortino:r[6],risk:r[7],copiers:r[8],aum:r[9],days:r[10],trades:r[11],conc:r[12],pos:r[13],hold:r[14],h:r[15],color:COLS[i],seed:101+i*37};
  t.sk=skill(t);t.score=t.sk.score;return t;});
const bySkill=[...TR].sort((a,b)=>b.score-a.score), byRaw=[...TR].sort((a,b)=>b.ret12-a.ret12);
bySkill.forEach((t,i)=>t.rank=i+1); byRaw.forEach((t,i)=>t.rawRank=i+1);
const tier=s=>s>=800?'Diamond':s>=600?'Platinum':s>=400?'Gold':s>=200?'Silver':'Bronze';
const TCOL={Diamond:'#7dd3fc',Platinum:'#d1d5db',Gold:'#e8b931',Silver:'#9ca3af',Bronze:'#c9803f'};
const carry=t=>t.id==='swarm'?SW.cr:({Diamond:.20,Platinum:.18,Gold:.15,Silver:.15,Bronze:.15})[tier(t.score)]; // higher tiers earn a higher carry
function series(t,ret,vol,seed){const r=rng(seed),n=52;let a=[0],x=0;for(let i=1;i<n;i++){x+=(r()-.5)*vol;a.push(x)}const e=a[n-1];return a.map((y,i)=>y-e*i/(n-1)+ret*i/(n-1));}
TR.forEach(t=>{t.curve=series(t,t.ret12,1+t.risk*1.5,t.seed)});
const BENCH=series(null,9.4,2.2,7);
/* Swarm Intelligence: one portfolio that follows the Arena-Score-weighted consensus of the top traders (top 100 at launch, top 8 here) */
const SWN=8,swTop=bySkill.slice(0,SWN),swSum=swTop.reduce((a,t)=>a+t.score,0);
swTop.forEach(t=>{t.w=t.score/swSum});
const swCurve=TR[0].curve.map((_,i)=>swTop.reduce((a,t)=>a+t.w*t.curve[i],0));
const swH={};swTop.forEach(t=>t.h.forEach(([k,v])=>{swH[k]=(swH[k]||0)+t.w*v}));
const swDD=swTop.reduce((a,t)=>a+t.w*t.dd,0); // weighted average of the traders' worst drops (conservative: they rarely coincide)
const SW={id:'swarm',name:'Swarm Intelligence',emoji:'🐝',color:'#c9a227',style:'Score-weighted crowd',curve:swCurve,ret12:swCurve[swCurve.length-1],ret3:swTop.reduce((a,t)=>a+t.w*t.ret3,0),
  risk:Math.round(swTop.reduce((a,t)=>a+t.w*t.risk,0)),dd:swDD,days:Math.min(...swTop.map(t=>t.days)),
  cr:swTop.reduce((a,t)=>a+t.w*carry(t),0),h:Object.entries(swH).map(([k,v])=>[k,Math.round(v)]).sort((a,b)=>b[1]-a[1])};
const T=id=>id==='swarm'?SW:TR[+id];

/* ---------- state ---------- */
const fresh=()=>({tab:'home',stack:[],trade:'stocks',port:'portfolio',filter:'skill',range:'1Y',wallet:50000,copies:[],isTrader:false,tstat:{copiers:0,aum:0,earned:0,months:0},accept:true,open:{}});
let S=fresh();

/* ---------- small components ---------- */
const initials=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const av=(t,s=44)=>`<div class="av" style="width:${s}px;height:${s}px;background:${t.color};font-size:${s*.36}px">${t.emoji||initials(t.name)}</div>`;
const tchip=t=>`<span class="chip" style="color:${TCOL[tier(t.score)]}">${tier(t.score)}</span>`;
const riskBars=n=>`<span class="bars">${[1,2,3,4,5].map(i=>`<i style="height:${4+i*1.5}px;${i<=n?'background:'+(n>=4?'var(--r)':n==3?'var(--gold)':'var(--gt)'):''}"></i>`).join('')}</span>`;
function spark(a,w=64,h=26){const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;const p=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');const c=a[a.length-1]>=a[0]?'#3fdc6b':'#ff4560';return`<svg width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;}
function chart(a,b){const w=340,h=150,all=[...a,...b],mn=Math.min(...all),mx=Math.max(...all),r=mx-mn||1;
  const P=s=>s.map((v,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-8-(v-mn)/r*(h-16)).toFixed(1)}`).join(' ');
  const up=a[a.length-1]>=0,c=up?'#3fdc6b':'#ff4560';
  return`<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
  <polygon points="0,${h} ${P(a)} ${w},${h}" fill="url(#gr)"/><polyline points="${P(b)}" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="4 4"/><polyline points="${P(a)}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/></svg>`;}
function donut(h){let off=0;const R=42,C=2*Math.PI*R,sec={};h.forEach(([k,v])=>{const s=SECTOR[k];sec[s]=(sec[s]||0)+v});
  const segs=Object.entries(sec).map(([k,v])=>{const d=v/100*C,e=`<circle r="${R}" cx="55" cy="55" fill="none" stroke="${SCOL[k]}" stroke-width="15" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 55 55)"/>`;off+=d;return e}).join('');
  return`<div style="display:flex;gap:16px;align-items:center"><svg width="110" height="110">${segs}</svg><div style="font-size:13px;line-height:1.9">${Object.entries(sec).map(([k,v])=>`<div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${SCOL[k]};margin-right:7px"></span>${k} <b>${v}%</b></div>`).join('')}</div></div>`;}

function vTLegal(){return`<div class="legal"><p class="mut">Copy Trader Agreement: for customers who allow others to copy them. Plain-language summary first; full terms below. Replace with counsel-approved text before launch.</p>
  <h4>1. What being copied means</h4><p>When you become a copy trader, investors on ZiiDi can choose to follow your portfolio. When you change your holdings, ZiiDi works out the matching orders for each follower and places them in <b>their own accounts</b>, only after they approve with their own M-PESA PIN. You give instructions only for your own account.</p>
  <h4>2. No access to followers’ money</h4><p>You cannot see, hold, move or withdraw any follower’s funds, and you cannot place orders in their accounts. Their shares stay in their own CDS accounts.</p>
  <h4>3. What others can see</h4><p>Once you are listed, your Arena Score, statistics, holdings and recent trades are visible to other ZiiDi customers <b>after market close</b>. Your name is shown as it appears on your profile. Follower names are never shown to you.</p>
  <h4>4. Getting listed</h4><p>You are listed after 90 days of shared trading history and at least 30 closed trades, with KYC complete and your own portfolio of at least KSh 100,000. Your first 90 days build your record. Eligibility can be reviewed at any time.</p>
  <h4>5. Your earnings</h4><p>You earn a share of the performance fee that followers pay on their profit, only when they make a profit. The fee is 15–20% depending on your tier, and you receive 70% of it. The remainder goes to ZiiDi. The fee is worked out only when a follower sells, on the profit actually realised on that sale, and taken from that sale’s proceeds. Each day’s collections are added up and your share is paid to your M-PESA once, after market close on the same day. Unsold gains are not owed and can fall before the sale. A follower who keeps their shares owes no fee on them, so you earn nothing on shares that are never sold. If followers do not profit, you earn nothing.</p>
  <h4>6. Followers’ results can differ from yours</h4><p>Followers’ timing, prices, fees and fills can differ from yours. They may update their copy later than you trade, or choose not to update. You are not responsible for followers’ gains or losses and do not guarantee any result.</p>
